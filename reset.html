<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Atualizar Anilhas</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0b0b0c;color:#ececea;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  main{max-width:420px;width:100%;background:#171719;border:1px solid #2c2c31;border-radius:18px;padding:24px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:#a8a8ad;margin:0 0 16px}
  strong{color:#ececea}
  a{display:block;text-align:center;background:#e53949;color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:10px}
  code{font-size:12px;color:#77777f;word-break:break-all}
</style>
<main>
  <h1>Atualizando o Anilhas</h1>
  <p id="status">Limpando o cache antigo. <strong>Seus treinos e cargas não são apagados.</strong></p>
  <p><a id="go" href="./">Abrir o app</a></p>
  <p><code id="detail"></code></p>
</main>
<script>
(async()=>{
  const status=document.getElementById('status'),detail=document.getElementById('detail');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    status.innerHTML='Cache limpo. Abrindo a versão nova. <strong>Seus registros continuam salvos.</strong>';
    setTimeout(()=>location.replace('./?atualizado='+Date.now()),900);
  }catch(error){
    status.innerHTML='Não foi possível limpar o cache automaticamente.';
    detail.textContent=String(error);
  }
})();
</script>
</html>
